        <!-- 函数 -->
        <!-- 声明 -->
        function sayHi() {
            document.write('hello world!')
            // 调用
            sayHi()
        }

        // 函数传参（（）里是参数列表）
        function sayHi(start, end) {
            // 形参
            document.write('hello world!')
            let sum = 0
            for (let i = start; i <= end; i++) { sum += i }
        } sayHi(2, 50) </script>
